; ==============================================================================
; PJSIP Configuration for Personal AI Call Agent
; Supports local testing softphones (MicroSIP, Zoiper, Linphone) & SIP Trunks
; ==============================================================================

[global]
type=global
user_agent=Personal-AI-Call-Agent-Asterisk

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; ------------------------------------------------------------------------------
; Local Inbound / Test Endpoint (Extension 1000 / Caller)
; ------------------------------------------------------------------------------
[1000]
type=endpoint
context=inbound-ai-agent
disallow=all
allow=ulaw
allow=alaw
allow=slin16
auth=auth1000
aors=1000
direct_media=no

[auth1000]
type=auth
auth_type=userpass
username=1000
password=password1000

[1000]
type=aor
max_contacts=5

; ------------------------------------------------------------------------------
; SIP Trunk Template (Twilio / Telnyx / Carrier)
; ------------------------------------------------------------------------------
[sip-trunk]
type=endpoint
context=inbound-ai-agent
disallow=all
allow=ulaw
allow=alaw
allow=slin16
direct_media=no
aors=sip-trunk

[sip-trunk]
type=aor
contact=sip:trunk.sip.provider.com:5060
