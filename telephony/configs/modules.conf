; ==============================================================================
; Asterisk Modules Configuration
; ==============================================================================

[modules]
autoload=yes

; Preload critical modules
preload => res_pjsip.so
preload => res_http_websocket.so

; Ensure ARI and Stasis are loaded
load => app_stasis.so
load => res_ari.so
load => res_ari_channels.so
load => res_ari_bridges.so
load => res_ari_playbacks.so
load => res_ari_recordings.so
load => res_ari_sounds.so
load => res_rtp_asterisk.so
load => codec_ulaw.so
load => codec_alaw.so
load => codec_g722.so
load => codec_resample.so
load => format_wav.so
load => format_pcm.so
load => format_sln.so

; Disable unused legacy channel drivers
noload => chan_sip.so
noload => chan_skinny.so
noload => chan_mgcp.so
noload => chan_unistim.so
