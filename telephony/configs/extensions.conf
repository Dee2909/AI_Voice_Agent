; ==============================================================================
; Asterisk Dialplan: Routes incoming telephone calls to AI Voice Agent Stasis app
; ==============================================================================

[general]
static=yes
writeprotect=no

[inbound-ai-agent]
; Route any incoming extension/DID to the Stasis AI Call Agent application
exten => _X.,1,NoOp(Incoming Call from ${CALLERID(num)} to ${EXTEN})
 same => n,Answer()
 same => n,Stasis(ai_call_agent)
 same => n,Hangup()

exten => s,1,NoOp(Incoming Default Call from ${CALLERID(num)})
 same => n,Answer()
 same => n,Stasis(ai_call_agent)
 same => n,Hangup()
